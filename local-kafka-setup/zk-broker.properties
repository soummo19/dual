# Broker config for the ZooKeeper-backed cluster (PushPlumeConsumerService).
#
# The apache/kafka image ships a KRaft-only entrypoint, so compose bypasses it
# and starts kafka-server-start.sh against this file. Anything driven by .env
# (the SSL port, the keystore passwords) is passed as --override in
# docker-compose.yml rather than hard-coded here.

broker.id=1
zookeeper.connect=zookeeper:2181
zookeeper.connection.timeout.ms=30000

listener.security.protocol.map=INTERNAL:SSL,EXTERNAL:SSL
inter.broker.listener.name=INTERNAL

ssl.keystore.location=/etc/kafka/secrets/KeyStore.jks
ssl.keystore.type=PKCS12
ssl.truststore.location=/etc/kafka/secrets/truststore.jks
ssl.truststore.type=PKCS12
ssl.client.auth=requested
ssl.endpoint.identification.algorithm=HTTPS

log.dirs=/var/lib/kafka/data
auto.create.topics.enable=false
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
default.replication.factor=1
min.insync.replicas=1
group.initial.rebalance.delay.ms=0

num.network.threads=3
num.io.threads=8
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600
log.retention.hours=1
log.segment.bytes=1073741824
log.retention.check.interval.ms=300000
