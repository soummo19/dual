# KRaft Mode Settings
process.roles=broker,controller
node.id=1
controller.quorum.voters=1@localhost:19193
controller.listener.names=CONTROLLER
log.dirs=/tmp/kafka-logs

# Listeners — INTERNAL for Kafbat/inter-broker, SSL for external clients, CONTROLLER for KRaft
listeners=INTERNAL://0.0.0.0:9192,SSL://0.0.0.0:9193,CONTROLLER://0.0.0.0:19193
advertised.listeners=INTERNAL://kafka-kraft:9192,SSL://localhost:9193
listener.security.protocol.map=INTERNAL:PLAINTEXT,SSL:SSL,CONTROLLER:PLAINTEXT
inter.broker.listener.name=INTERNAL

# SSL Configuration
ssl.keystore.location=/etc/kafka/certs/kafka.keystore.jks
ssl.keystore.password=changeit
ssl.key.password=changeit
ssl.truststore.location=/etc/kafka/certs/kafka.truststore.jks
ssl.truststore.password=changeit
ssl.client.auth=none
ssl.endpoint.identification.algorithm=

# Internal Topics
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1

# Auto create topics
auto.create.topics.enable=true
